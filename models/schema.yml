version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
     - name: product
       identifier: raw_gz_product
     - name: sales
       identifier: raw_gz_sales
     - name: ship
       identifier: raw_gz_ship

models:
  - name: product
    description: product data
    columns:
      - name: products_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: purchase_price
        description: cena zakupu
  - name: sales
    description: sales data
    columns:
      - name: date_date
        description: day of article sold
      - name: orders_id
        description: id of the order
      - name: products_id
        description: id of product
      - name: revenue
        description: to the company in eur
      - name: quantity
        description: qty of article sold
    tests:
      - unique:
         column_name: "(orders_id || '-' || products_id)"
  - name: ship
    description: shipping data
    columns:
      - name: orders_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: shipping_fee
        description: oplata za wysylke
      - name: log_cost
        description: chuj go wie
      - name: ship_cost
        description: jak wyzej
  - name: int_orders_margin
    description: margin calculation per order
    columns:
       - name: orders_id
         description: primary key
         tests:
           - unique
           - not_null
       - name: margin
         description: margin = revenue - purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: purchase_cost = quantity * purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null

  - name: int_sales_margin
    description: margin calculation per order line / product sales
    columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
       - name: products_id
         description: products key
         tests:
           - not_null
       - name: margin
         description: margin = revenue - purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: purchase_cost = quantity * purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
    tests:
       - unique:
           column_name: "(orders_id || '-' || products_id)"

  - name: int_orders_operational
    description: operational margin calculation per order
    columns:
       - name: orders_id
         description: primary key
         tests:
           - unique
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: operational_margin
         description: operational_margin = margin + shipping_fee - log_cost - ship_cost
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: purchase_cost
         description: purchase_cost = quantity * purchase_price
         tests:
           - not_null
       - name: margin
         description: margin = revenue - purchase_cost
         tests:
           - not_null
       - name: shipping_fee
         description: the price the customer pays for shipping
       - name: log_cost
         description: the cost of preparing the parcel in the distribution centre/warehouse
       - name: ship_cost
         description: shipping cost paid by Greenweez to the carrier/logistics provider
     
